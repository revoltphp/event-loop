name: Continuous Integration

on:
  - push
  - pull_request

jobs:
  tests:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - operating-system: 'ubuntu-latest'
            php-version: 8.1
            composer-flags: '--ignore-platform-req=php+'
            psalm: 'skip'

          - operating-system: 'ubuntu-latest'
            php-version: 8.2
            composer-flags: '--ignore-platform-req=php+'

          - operating-system: 'ubuntu-latest'
            php-version: 8.3
            composer-flags: '--ignore-platform-req=php+'

          - operating-system: 'ubuntu-latest'
            php-version: 8.4
            composer-flags: '--ignore-platform-req=php+'

          - operating-system: 'ubuntu-latest'
            php-version: 8.5
            composer-flags: '--ignore-platform-req=php+'

          - operating-system: 'ubuntu-latest'
            php-version: 8.6
            composer-flags: '--ignore-platform-req=php+'
            psalm: 'skip' # psalm/phar does not run on 8.6 yet

          - operating-system: 'ubuntu-latest'
            php-version: 8.4
            composer-flags: '--ignore-platform-req=php+'
            job-description: 'with the Io\Poll polyfill'
            io-poll-polyfill: 'yes'
            psalm: 'skip'

          # kqueue and WSAPoll back IoPollDriver there, instead of epoll
          - operating-system: 'macos-latest'
            php-version: 8.6
            composer-flags: '--ignore-platform-req=php+'
            job-description: 'on macOS'
            extensions: ':xdebug'
            psalm: 'skip'

          - operating-system: 'windows-latest'
            php-version: 8.6
            composer-flags: '--ignore-platform-req=php+'
            job-description: 'on Windows'
            extensions: ':xdebug'
            psalm: 'skip'

    name: PHP ${{ matrix.php-version }} ${{ matrix.job-description }}
    runs-on: ${{ matrix.operating-system }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libuv1-dev libevent-dev
        if: runner.os == 'Linux'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions:  ${{ matrix.extensions || 'uv-amphp/ext-uv@0.3.x, event, :xdebug'  }}
          tools: pie
        env:
          # Workaround for https://github.com/shivammathur/setup-php/issues/1146 (cd "" fails on bash 5.3)
          UV_PATH: .

      - name: Install ev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PIE refuses to call sudo itself in a non-interactive terminal, but the runner has passwordless sudo
          sudo --preserve-env=GITHUB_TOKEN pie install osmanov/pecl-ev
          php --ri ev

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('**/composer.*') }}-${{ matrix.composer-flags }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('**/composer.*') }}-
            composer-${{ runner.os }}-${{ matrix.php-version }}-
            composer-${{ runner.os }}-
            composer-

      - name: Remove psalm/phar
        run: composer remove --no-update --dev psalm/phar
        if: matrix.psalm == 'skip'

      - name: Install dependencies
        run: |
          composer update --optimize-autoloader --no-interaction --no-progress ${{ matrix.composer-flags }}
          php -v
          composer info -D

      # 1.x until the Io\Poll fixes the driver needs are released, see symfony/polyfill#655 and #656
      - name: Install the Io\Poll polyfill
        run: composer require --dev --no-interaction --no-progress ${{ matrix.composer-flags }} symfony/polyfill-io-poll:1.x-dev symfony/polyfill-time:1.x-dev
        if: matrix.io-poll-polyfill

      - name: Run tests
        run: php vendor/bin/phpunit

      - name: Run tests without pcntl
        run: php -d disable_functions=pcntl_signal_dispatch vendor/bin/phpunit

      - name: Run Psalm
        run: vendor/bin/psalm.phar --show-info=true
        if: matrix.psalm != 'skip'

      - name: Run style fixer
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1
        run: |
          composer install --optimize-autoloader --no-interaction --no-progress --working-dir=tools/php-cs-fixer
          tools/php-cs-fixer/vendor/bin/php-cs-fixer --diff --dry-run -v fix
        if: runner.os == 'Linux'
